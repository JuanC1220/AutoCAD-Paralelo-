# Publica una versión (Release) al subir una etiqueta vX.Y.Z.
# Toma las notas y los .zip de paquete/versiones/<etiqueta>/.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear la versión
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="paquete/versiones/$TAG"
          titulo=$(head -1 "$dir/notas.md" | sed 's/^#* *//; s/:.*//')
          gh release create "$TAG" "$dir"/*.zip --title "$titulo" --notes-file "$dir/notas.md" --verify-tag
