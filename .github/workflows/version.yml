# Publica una versión (Release) por cada carpeta paquete/versiones/vX.Y.Z/ que aún no la tenga.
# La carpeta lleva notas.md (la primera línea es el título) y los .zip para descargar.
# Corre al fusionar en main cambios en esa carpeta, o a mano desde la pestaña Actions.
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ["paquete/versiones/**", ".github/workflows/version.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear las versiones que falten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in paquete/versiones/v*/; do
            tag=$(basename "$dir")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag ya publicada"
              continue
            fi
            titulo=$(head -1 "$dir/notas.md" | sed 's/^#* *//; s/:.*//')
            gh release create "$tag" "$dir"*.zip --title "$titulo" --notes-file "$dir/notas.md" --target "$GITHUB_SHA"
          done
